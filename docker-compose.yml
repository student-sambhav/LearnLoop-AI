services:
  postgres:
    image: postgres:16-alpine
    container_name: vectordb-postgres
    environment:
      POSTGRES_DB: vectordb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - vectordb_pgdata:/var/lib/postgresql/data

volumes:
  vectordb_pgdata:
